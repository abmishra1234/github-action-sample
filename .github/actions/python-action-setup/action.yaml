name: Python Project Setup and Execution
description: Set up Python, run tests, build a wheel, and verify the installed application.

inputs:
  python-version:
    description: The version of Python to install
    required: true
    default: '3.12'
  working-directory:
    description: Path containing the requirements files and Python project
    required: false
    default: './'
  doWeWantToInstallDependencies:
    description: Set to 'false' only when dependencies are already installed
    required: false
    default: 'true'

outputs:
  python-version:
    description: The exact version of Python installed
    value: ${{ steps.pythonid.outputs.python-version }}

runs:
  using: composite
  steps:
    - name: Setup Python
      id: pythonid
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          ${{ inputs.working-directory }}/requirements.txt
          ${{ inputs.working-directory }}/requirements-dev.txt

    - name: Install the dependencies
      if: ${{ inputs.doWeWantToInstallDependencies == 'true' }}
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: python -m pip install -r requirements-dev.txt

    - name: Execute the Unit Tests
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: python -m pytest

    - name: Build the wheel package
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: python -m build --wheel

    - name: Check wheel metadata
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: python -m twine check --strict dist/*.whl

    - name: Verify the installed wheel
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: python scripts/verify_wheel.py
