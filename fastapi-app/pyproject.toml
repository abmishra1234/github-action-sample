[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-app"
version = "0.1.0"
description = "Sample FastAPI greeting application for GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--junitxml=report/test-results.xml --cov=app --cov-report=term-missing --cov-report=html:report/coverage --cov-report=xml:report/coverage.xml --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Minimum line coverage enforced by `coverage report`. Override with --fail-under=90
fail_under = 80
show_missing = true
